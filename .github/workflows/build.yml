name: Build

# Builds pull requests, master and v* tags. Changes that only touch docs skip the build (path
# filters don't apply to tag pushes, so tagged releases always build).
#
# Releasing: merge a PR labelled `release` (next patch, e.g. v0.7.18 -> v0.7.19) or
# `release:minor` (v0.7.18 -> v0.8.0). That merge's build is tested, smoke-tested and published
# as is: nothing is rebuilt. Fallback: run this workflow by hand on master to publish the build
# of master's latest commit (it must have passed), e.g. when the label was forgotten.
on:
  push:
    branches: [master]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "app/src/main/assets/licenses/**"
      - "LICENSE*"
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "app/src/main/assets/licenses/**"
      - "LICENSE*"
  workflow_dispatch:

permissions:
  contents: write
  actions: read # to find and download earlier builds
  pull-requests: read # to read the merged PR's labels

# A newer PR push supersedes an older build of the same PR. Builds of master are never cancelled,
# since any of them may be a release.
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Master builds carry the next version, so whichever one is released ships unchanged.
      - name: Plan version and release
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci-plan-release.sh

      # Optional Play-ready signing. Add these repository secrets to enable it:
      # KEYSTORE_BASE64 (base64 of the .jks), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      - name: Decode signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "METRO_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build
        env:
          METRO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          METRO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          METRO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Releases must be signed with the real key; PR builds have no secrets and fall back.
          REQUIRE_SIGNING: ${{ steps.plan.outputs.release == 'true' && '-PrequireReleaseSigning=true' || ' ' }}
        run: >
          ./gradlew testDebugUnitTest lintDebug assembleRelease bundleRelease
          -PversionName=${{ steps.plan.outputs.version }}
          -PversionCode=${{ github.run_number }}
          $REQUIRE_SIGNING

      # R8 can't see reflection, so a missing keep rule only shows up as a crash on a phone
      # (v0.7.16 lost WorkManager's database constructor). Catch that class of bug here.
      - name: Check the release APK for stripped constructors
        run: >
          python3 tools/check-release-apk.py app/build/outputs/apk/release/app-release.apk
          app/build/outputs/mapping/release/mapping.txt

      - name: Collect outputs
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/metro-launcher-${{ steps.plan.outputs.version }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/metro-launcher-${{ steps.plan.outputs.version }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: metro-launcher-${{ steps.plan.outputs.version }}
          path: dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/outputs/roborazzi/
            app/build/test-results/
            app/build/outputs/mapping/release/mapping.txt

  # Installs the minified release APK on an emulator, opens it, drives it with random input
  # and fails on any crash of the app. Unit tests run the unminified code, so only this sees
  # what R8 did to it.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: metro-launcher-${{ needs.build.outputs.version }}
          path: dist

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch and exercise the release build
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: tools/smoke-test.sh dist/*.apk

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logcat
          path: smoke-logcat.txt
          if-no-files-found: ignore

  # Publishes the build above once it passed every check: for a merged PR labelled release,
  # or a pushed v* tag.
  release:
    needs: [build, smoke]
    if: needs.build.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: metro-launcher-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ env.KEYSTORE_BASE64 == '' }}

  # Manual fallback: publishes the existing, passed build of master's latest commit, no rebuild.
  publish-latest:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Find and download the build
        id: found
        run: tools/ci-download-build.sh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.found.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ env.KEYSTORE_BASE64 == '' }}
