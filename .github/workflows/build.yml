name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.2.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      # Optional Play-ready signing. Add these repository secrets to enable it:
      # KEYSTORE_BASE64 (base64 of the .jks), KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD.
      - name: Decode signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "METRO_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test, lint and build
        env:
          METRO_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          METRO_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          METRO_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: >
          ./gradlew testDebugUnitTest lintDebug assembleRelease bundleRelease
          -PversionName=${{ steps.version.outputs.name }}
          -PversionCode=${{ github.run_number }}

      - name: Collect outputs
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/metro-launcher-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/metro-launcher-${{ steps.version.outputs.name }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: metro-launcher-${{ steps.version.outputs.name }}
          path: dist/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/outputs/roborazzi/

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ env.KEYSTORE_BASE64 == '' }}
