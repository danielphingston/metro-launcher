org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Smaller APK/AAB: R8 shrinks resources together with code.
android.r8.optimizedResourceShrinking=true
# AGP 9 made library keep rules "strict" (a bare -keep class no longer keeps its constructor),
# which broke WorkManager at runtime. Keep the AGP 8 meaning until every library is updated.
android.r8.strictFullModeForKeepRules=false
